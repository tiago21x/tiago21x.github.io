<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiago21x</title>
<link rel="icon" href="Nike.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --muted: #8a8d93;
    --line: rgba(255, 255, 255, .08);
    --mono: "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scrollbar-color: #555 #111; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---------- Cabeçalho ---------- */
  .topbar {
    position: fixed; inset: 0 0 auto 0; z-index: 10;
    width:100vw;box-sizing:border-box;
    height: 52px;
    display: flex; align-items: center; justify-content: space-between; gap: 18px;
    padding: 0 22px;
    background: rgba(0, 0, 0, .7);
    backdrop-filter: blur(10px);
  }
  .topbar svg { width: 46px; height: auto; fill: var(--fg); }
  .brand {
    font-family: var(--mono); font-weight: 700;
    font-size: 15px; letter-spacing: .12em;
  }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: 110px 24px 80px;
    isolation: isolate;
  }

  /* grade + brilho central */
  .hero::before {
    content: ""; position: absolute; inset: 0; z-index: -2;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 60px 60px;
    -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 85%);
            mask-image: radial-gradient(ellipse at center, #000 30%, transparent 85%);
  }
  .hero::after {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: radial-gradient(circle at 50% 42%, rgba(255, 255, 255, .09), transparent 55%);
    pointer-events: none;
  }

  .logo { width: 104px; fill: var(--fg); margin-bottom: 38px; }

  .tag {
    font-family: var(--mono); font-weight: 500;
    font-size: 11px; letter-spacing: .3em;
    color: #6b6e75; text-transform: uppercase;
    margin-bottom: 26px;
  }

  h1 {
    font-weight: 800;
    font-size: clamp(64px, 20vw, 112px);
    line-height: .95;
    letter-spacing: -.045em;
    margin-bottom: 30px;
  }

  .lead {
    max-width: 330px;
    font-size: 16px; line-height: 1.65;
    color: var(--muted);
    margin-bottom: 40px;
  }

  .lead { margin-bottom: 18px; }
  .verse {
    max-width: 330px;
    font-size: 14px; line-height: 1.6; font-style: italic;
    color: #6b6e75;
    margin-bottom: 40px;
  }
  .verse strong { font-weight: 700; color: #b4b7be; }
  .verse cite {
    display: block; margin-top: 8px;
    font-family: var(--mono); font-style: normal; font-weight: 500;
    font-size: 11px; letter-spacing: .2em; color: var(--muted);
  }

  .actions { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }

  .btn {
    font-family: var(--mono); font-weight: 700;
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    text-decoration: none;
    padding: 0 24px; height: 42px;
    display: inline-flex; align-items: center;
    border-radius: 999px;
    transition: transform .2s, background .2s, border-color .2s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .btn--solid { background: #0055FF; color: #fff; }
  .btn--solid:hover { background: #0055ff; }
  .btn--ghost { color: var(--fg); border: 1px solid rgba(255, 255, 255, .15); }
  .btn--ghost:hover { border-color: rgba(255, 255, 255, .5); }

  /* ---------- Ondas (mesmo sistema do convite: canvas 2D) ---------- */
  .waves {
    position: absolute; left: 0; right: 0; top: 50%; z-index: -1;
    height: 360px; transform: translateY(-50%);
    overflow: hidden; pointer-events: none;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
  }
  #waterCanvas { display: block; width: 100%; height: 100%; }

  h1, .lead { text-shadow: 0 2px 18px rgba(0, 0, 0, .8); }
</style>
</head>
<body>

  <header class="topbar">
    <span class="brand">TIAGO21X</span>

    <svg viewBox="0 0 960 343" aria-hidden="true"><path d="M91.6 340.9C76.4 338.9 58.4 333.0 47.4 326.4C-21.3 285.1 -14.9 193.0 64.1 87.5C80.0 66.2 137.0 -0.2 137.0 2.5C137.0 2.7 134.5 7.4 131.6 12.7C100.3 68.7 93.6 123.8 113.8 157.8C134.7 193.0 175.7 205.9 236.1 196.5C254.1 193.6 222.0 202.0 641.5 90.5C682.2 79.7 769.5 56.5 835.4 38.9C901.4 21.4 955.5 7.2 955.6 7.3C955.9 7.6 930.2 18.6 529.5 190.1C385.4 251.7 259.3 305.5 249.3 309.6C187.0 335.0 131.5 346.0 91.6 340.9Z"/></svg>
  </header>

  <main class="hero">
    <div class="waves" aria-hidden="true">
      <canvas id="waterCanvas"></canvas>
    </div>

    <svg class="logo" viewBox="0 0 960 343" aria-hidden="true"><path d="M91.6 340.9C76.4 338.9 58.4 333.0 47.4 326.4C-21.3 285.1 -14.9 193.0 64.1 87.5C80.0 66.2 137.0 -0.2 137.0 2.5C137.0 2.7 134.5 7.4 131.6 12.7C100.3 68.7 93.6 123.8 113.8 157.8C134.7 193.0 175.7 205.9 236.1 196.5C254.1 193.6 222.0 202.0 641.5 90.5C682.2 79.7 769.5 56.5 835.4 38.9C901.4 21.4 955.5 7.2 955.6 7.3C955.9 7.6 930.2 18.6 529.5 190.1C385.4 251.7 259.3 305.5 249.3 309.6C187.0 335.0 131.5 346.0 91.6 340.9Z"/></svg>

    <p class="tag">Estudante · Ensino Médio</p>
    <h1>TIAGO</h1>
    <p class="lead">18 anos, cursando o 2º ano do ensino médio. Aprendi a escrever código com 10 anos e faço isso até hoje</p>
    <p class="verse">Não nos tratou segundo <strong>os nossos pecados</strong>, nem nos recompensou segundo <strong>as nossas iniquidades</strong>.
      <cite>Salmo 103:10</cite></p>

    <div class="actions">
      <a class="btn btn--solid" href="https://instagram.com/tiago21x" target="_blank" rel="noopener">Instagram</a>
      <a class="btn btn--ghost" href="https://github.com/tiago21x" target="_blank" rel="noopener">Github</a>
    </div>
  </main>

<script>
/* Ondas — mesma lógica do site do convite */
(function () {
  const canvas1 = document.getElementById('waterCanvas');
  const ctx1 = canvas1.getContext('2d');
  const waveCount = 30;
  let waves = [];
  let waterAlpha = "0.01";
  let waterTicks = 0;

  function getRandom(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function resize() {
    canvas1.width = canvas1.offsetWidth;
    canvas1.height = canvas1.offsetHeight;
    waves.forEach((wave) => {
      wave.y = canvas1.height / 2;
      wave.amplitude = canvas1.height / 3;
    });
  }

  canvas1.width = canvas1.offsetWidth;
  canvas1.height = canvas1.offsetHeight;

  for (let i = 0; i < waveCount; i++) {
    waves.push({
      y: canvas1.height / 2,
      length: 0.012,
      amplitude: canvas1.height / 3,
      frequency: getRandom(10, 20) / 1000,
      phase: Math.PI * 2
    });
  }

  window.addEventListener('resize', resize);

  function drawWater() {
    waterTicks++;
    if (waterTicks >= 500) {
      waterAlpha = waterAlpha === "0.01" ? "0.05" : "0.01";
      waterTicks = 0;
    }

    // esmaece o rastro (mantém o canvas transparente para a grade aparecer)
    ctx1.globalCompositeOperation = 'destination-out';
    ctx1.fillStyle = `rgba(0,0,0,${waterAlpha})`;
    ctx1.fillRect(0, 0, canvas1.width, canvas1.height);
    ctx1.globalCompositeOperation = 'source-over';

    waves.forEach((wave, i) => {
      ctx1.beginPath();
      ctx1.moveTo(0, wave.y);
      for (let x = 0; x < canvas1.width; x++) {
        const yOffset = Math.sin(x * wave.length + wave.phase) * wave.amplitude * Math.sin(wave.phase);
        ctx1.lineTo(x, wave.y + yOffset);
      }
      ctx1.strokeStyle = `hsla(${i / 2 + 220}, 100%, 50%, 0.45)`;
      ctx1.stroke();
      wave.phase += wave.frequency;
    });
  }

  function loop() {
    requestAnimationFrame(loop);
    drawWater();
  }

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    for (let i = 0; i < 60; i++) drawWater();
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>

</body>
</html>
