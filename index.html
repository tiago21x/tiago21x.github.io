<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <link rel="icon" type="image/x-icon" href="Nike.png">

    <title>Tiago</title>

    <style>
        body{
            background:#0D0D0D;
        }

        .mainHeader{
            width:100%;height:60px;

            position:relative;
            left:0px;top:0px;

            background:none;
        }

        .headerTitle{
            width:50%;height:60px;

            position:absolute;
            left:0px;top:0px;

            background:none;
            color:#FFFFFF;

            font-family:Arial;
            font-size:24px;
            line-height:60px;

            margin:0px;padding:0px 0px 0px 10px;

            display:flex;
            align-items:center;
        }

        .headerIcon{
            width:auto;height:40px;

            position:absolute;
            right:10px;top:10px;

            filter:invert(100%);

            margin:0px;padding:0px;
        }

        .circle{
            width:300px;height:300px;

            position:absolute;
            right:-120px;top:-120px;

            background:none;
            border-radius:300px;
            border:1px solid #707070;

            margin:0px;padding:0px;
        }

        .mainSection{
            width:calc(100% - 20px);height:auto;

            position:relative;
            left:10px;top:20px;

            margin:0px;padding:0px 0px 20px 0px;

            border:none;
        }

        .mainSectionTitle{
            width:100%;height:45px;

            position:relative;
            left:0px;top:0px;

            background:none;
            color:#FFFFFF;

            font-family:Arial;
            font-size:45px;
            line-height:45px;

            margin:0px;padding:0px;gap:0px;

            display:flex;
            align-items:center;
        }
        
        .mainSectionText{
            width:75%;height:100px;

            position:relative;
            left:0px;top:20px;

            background:none;
            color:#B0B0B0;

            font-family:Arial;
            font-size:16px;
            line-height:16px;

            margin:0px 0px 20px 0px;padding:0px;gap:0px;
        }

        .socialmedia{
            width:auto;height:35px;

            position:relative;
            left:0px;top:0px;

            background:none;
            border:1px solid #B0B0B0;border-radius:5px;
            color:#B0B0B0;

            font-family:Arial;
            font-size:12px;
            line-height:12px;

            margin:0px;padding:0px 10px;gap:0px;
            vertical-align:middle;
        }

        .socialmediaIcon{
            width:17px;height:17px;

            position:relative;
            left:0px;top:0px;

            background:none;
            border:none;
            filter:invert(100%);

            margin:0px;padding:0px;gap:0px;
            vertical-align:middle;
        }

        a{
            color:#B0B0B0;text-decoration:none;
        }
    </style>
</head>
<body>
    <header class="mainHeader">
        <h1 class="headerTitle">Tiago</h1>
        <img class="headerIcon" src="Nike.png">
    </header>

    <div class="circle"></div>

    <section class="mainSection">
        <h2 class="mainSectionTitle">Just do it.</h2>
        <p class="mainSectionText">¹⁰ Não nos tratou segundo os <span style="font-weight:bold;color:#E0E0E0">nossos pecados</span>, nem nos recompensou segundo as <span style="font-weight:bold;color:#E0E0E0">nossas iniquidades</span>.<br><br>Salmos 103:10 ACF</p>

        <button class="socialmedia"><img class="socialmediaIcon" src="Instagram.png"> <a target="_blank" href="https://instagram.com/tiago21x">Instagram</a></button>
        <button class="socialmedia"><img class="socialmediaIcon" src="Github.png"> <a target="_blank" href="https://github.com/tiago21x">Github</a></button>
    </section>
</body>
</html>
