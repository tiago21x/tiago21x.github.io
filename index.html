<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiago21x</title>
<link rel="icon" href="Nike.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --muted: #8a8d93;
    --line: rgba(255, 255, 255, .08);
    --mono: "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scrollbar-color: #555 #111; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---------- Cabeçalho ---------- */
  .topbar {
    position: fixed; inset: 0 0 auto 0; z-index: 10;
    height: 52px;
    display: flex; align-items: center; justify-content: space-between; gap: 18px;
    padding: 0 22px;
    background: rgba(0, 0, 0, .7);
    backdrop-filter: blur(10px);
  }
  .topbar svg { width: 46px; height: auto; fill: var(--fg); }
  .brand {
    font-family: var(--mono); font-weight: 700;
    font-size: 15px; letter-spacing: .12em;
  }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: 110px 24px 80px;
    isolation: isolate;
  }

  /* grade + brilho central */
  .hero::before {
    content: ""; position: absolute; inset: 0; z-index: -2;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 60px 60px;
    -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 85%);
            mask-image: radial-gradient(ellipse at center, #000 30%, transparent 85%);
  }
  .hero::after {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: radial-gradient(circle at 50% 42%, rgba(255, 255, 255, .09), transparent 55%);
    pointer-events: none;
  }

  .logo { width: 104px; fill: var(--fg); margin-bottom: 38px; }

  .tag {
    font-family: var(--mono); font-weight: 500;
    font-size: 11px; letter-spacing: .3em;
    color: #6b6e75; text-transform: uppercase;
    margin-bottom: 26px;
  }

  h1 {
    font-weight: 800;
    font-size: clamp(64px, 20vw, 112px);
    line-height: .95;
    letter-spacing: -.045em;
    margin-bottom: 30px;
  }

  .lead {
    max-width: 330px;
    font-size: 16px; line-height: 1.65;
    color: var(--muted);
    margin-bottom: 40px;
  }

  .lead { margin-bottom: 18px; }
  .verse {
    max-width: 330px;
    font-size: 14px; line-height: 1.6; font-style: italic;
    color: #6b6e75;
    margin-bottom: 40px;
  }
  .verse strong { font-weight: 700; color: #b4b7be; }
  .verse cite {
    display: block; margin-top: 8px;
    font-family: var(--mono); font-style: normal; font-weight: 500;
    font-size: 11px; letter-spacing: .2em; color: var(--muted);
  }

  .actions { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }

  .btn {
    font-family: var(--mono); font-weight: 700;
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    text-decoration: none;
    padding: 0 24px; height: 42px;
    display: inline-flex; align-items: center;
    border-radius: 999px;
    transition: transform .2s, background .2s, border-color .2s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .btn--solid { background: #f4f4f4; color: #000; }
  .btn--solid:hover { background: #fff; }
  .btn--ghost { color: var(--fg); border: 1px solid rgba(255, 255, 255, .15); }
  .btn--ghost:hover { border-color: rgba(255, 255, 255, .5); }

  /* ---------- Onda em fita (várias linhas finas sobrepostas) ---------- */
  .waves {
    position: absolute; left: 0; right: 0; top: 50%; z-index: -1;
    height: 300px; transform: translateY(-50%);
    overflow: hidden; pointer-events: none;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
  }
  .waves::before {                      /* brilho azul suave (mais leve que filter) */
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(30, 70, 255, .22), transparent 65%);
  }
  .ribbon {
    position: relative; display: block; height: 100%; overflow: visible;
    width: 300%;                         /* desliza -50% e recomeça sem emenda */
    animation: drift 26s linear infinite;
  }
  .ribbon path {
    fill: none;
    stroke: rgb(60, 100, 255); stroke-width: 1;
    opacity: var(--o);
    vector-effect: non-scaling-stroke;
    transform-box: fill-box; transform-origin: center;
    /* cada linha tem fase e duração próprias: a forma da fita muda sem parar */
    animation: sway calc(7s + var(--i) * .8s) ease-in-out infinite alternate;
    animation-delay: calc(var(--i) * -.4s);
  }
  @keyframes drift { to { transform: translateX(-50%); } }
  @keyframes sway {
    from { transform: translate(-140px, -10px) scaleY(.85); opacity: calc(var(--o) * .4); }
    to   { transform: translate(140px, 10px)  scaleY(1.2);  opacity: var(--o); }
  }

  h1, .lead { text-shadow: 0 2px 18px rgba(0, 0, 0, .8); }

@media (prefers-reduced-motion: reduce) {
    .ribbon, .ribbon path { animation: none; }
  }
</style>
